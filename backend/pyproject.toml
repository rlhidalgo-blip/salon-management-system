[project]
name = "salon-management-system-backend"
version = "0.1.0"
description = "FastAPI backend for Yab's Salon Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=9.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["core*", "migrations*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
